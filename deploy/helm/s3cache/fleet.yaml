# Fleet bundle for s3cache — the transparent S3 caching proxy in front of R2.
# Co-located with Chart.yaml. Data-plane, so consumers (docres) can reach it in-cluster.
# The R2 credentials come from the committed secrets bundle (s3cache-s3); the image tag
# is rewritten by CI (bump-fleet-tag) after each build.
defaultNamespace: data
labels:
  napbat.ca/role: data-plane
helm:
  releaseName: s3cache
  values:
    # One replica is sufficient for the current workload. Scaling is only this
    # number; replicas join by name off pod-0 when this is raised again.
    replicaCount: 1
    image:
      tag: dc79b360995af8c5f051ddf62a8267f36511c915
    upstream:
      endpoint: https://e340c486028724e7b58d09928fdf10e2.r2.cloudflarestorage.com
      buckets: docres
    # 2 GiB hot heap; evictions roll over into a 20 GiB warm disk tier on a
    # per-ordinal PVC, so a redeployed/restarted pod comes up warm instead of
    # re-paying cold R2 reads (get_miss was climbing with warm_hit pinned at 0).
    memoryCache:
      bytes: 2147483648
    diskCache:
      enabled: true
      bytes: 21474836480
      volumeClaimTemplate:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 25Gi
