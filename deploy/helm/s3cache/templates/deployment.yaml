apiVersion: apps/v1
kind: Deployment
metadata:
  name: s3cache
  labels:
    app.kubernetes.io/name: s3cache
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    {{- if .Values.indexLog.enabled }}
    # The shared index commit log keeps replicas coherent, so a rolling update (and
    # replicaCount > 1) is safe.
    type: RollingUpdate
    {{- else }}
    # No shared index: each proxy has its own in-memory index, so Recreate avoids two
    # of them briefly diverging during a roll. Keep replicaCount at 1 in this mode.
    type: Recreate
    {{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: s3cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: s3cache
    spec:
      {{- with .Values.imagePullSecret.existingSecret }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      containers:
        - name: s3cache
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: s3
              containerPort: 8014
          env:
            - name: S3CACHE_LISTEN
              value: "0.0.0.0:8014"
            - name: S3CACHE_UPSTREAM_ENDPOINT
              value: {{ required "upstream.endpoint is required" .Values.upstream.endpoint | quote }}
            - name: S3CACHE_BUCKETS
              value: {{ .Values.upstream.buckets | quote }}
            {{- if .Values.diskCache.enabled }}
            - name: S3CACHE_DISK_CACHE
              value: {{ .Values.diskCache.path | quote }}
            - name: S3CACHE_DISK_CACHE_BYTES
              value: {{ .Values.diskCache.bytes | quote }}
            {{- end }}
            {{- if .Values.indexLog.enabled }}
            - name: S3CACHE_INDEX_LOG
              value: "true"
            - name: S3CACHE_INDEX_LOG_MAXLEN
              value: {{ .Values.indexLog.maxlen | quote }}
            {{- with .Values.indexLog.stream }}
            - name: S3CACHE_INDEX_LOG_STREAM
              value: {{ . | quote }}
            {{- end }}
            - name: S3CACHE_VALKEY_URL
              value: {{ required "valkey.url is required when indexLog.enabled" .Values.valkey.url | quote }}
            - name: S3CACHE_VALKEY_POOL
              value: {{ .Values.valkey.pool | quote }}
            {{- end }}
            - name: RUST_LOG
              value: "info"
          # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_REGION for the upstream.
          envFrom:
            - secretRef:
                name: {{ .Values.auth.existingSecret }}
          # No startupProbe needed: the proxy binds + serves immediately and warms its LIST
          # index in the background (LISTs pass through until warm), so readiness/liveness
          # can engage right away regardless of bucket size.
          readinessProbe:
            tcpSocket:
              port: s3
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: s3
            initialDelaySeconds: 10
            periodSeconds: 30
          resources: {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.diskCache.enabled }}
          volumeMounts:
            - name: disk-cache
              mountPath: {{ .Values.diskCache.path }}
          {{- end }}
      {{- if .Values.diskCache.enabled }}
      volumes:
        - name: disk-cache
          {{- toYaml .Values.diskCache.volume | nindent 10 }}
      {{- end }}
