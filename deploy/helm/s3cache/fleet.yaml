# Fleet bundle for s3cache — the transparent S3 caching proxy in front of R2.
# Co-located with Chart.yaml. Data-plane, so consumers (docres) can reach it in-cluster.
# The R2 credentials come from the committed secrets bundle (s3cache-s3); the image tag
# is rewritten by CI (bump-fleet-tag) after each build.
defaultNamespace: data
labels:
  napbat.ca/role: data-plane
helm:
  releaseName: s3cache
  values:
    # Two replicas share byte-bounded coherence feeds. Each ordinal keeps its own
    # warm-cache PVC, while Fleet and the PDB retain one serving replica during
    # routine image rollouts.
    replicaCount: 2
    image:
      tag: c44cb2b8750db0fecad7bd3384783178ae40ae4b
    upstream:
      endpoint: https://e340c486028724e7b58d09928fdf10e2.r2.cloudflarestorage.com
      buckets: docres
    # Export the indexed object/byte gauges and cache/coherence counters for
    # continuous bucket-footprint and data-plane health monitoring.
    metrics:
      enabled: true
    # 2 GiB hot heap; evictions roll over into a 20 GiB warm disk tier on a
    # per-ordinal PVC, so a redeployed/restarted pod comes up warm instead of
    # re-paying cold R2 reads (get_miss was climbing with warm_hit pinned at 0).
    memoryCache:
      bytes: 2147483648
      # 32 MiB: get_bypass showed a band of segment blobs just over the 8 MiB
      # default streaming from R2 on every read; the 2G/20G budgets have room.
      maxObjectBytes: 33554432
    diskCache:
      enabled: true
      bytes: 21474836480
      volumeClaimTemplate:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 25Gi
