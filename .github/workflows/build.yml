name: build

# Test-gate, build + push the s3cache image to GHCR, then bump the Fleet chart tag to
# the built SHA so Fleet rolls it. The bump lands only after BOTH the image push and
# the test suite succeed, so Fleet never chases a missing image or ships a red build.
#
# Jobs are inlined rather than calling napbat/cicd's reusable workflows: this repo is
# public and cicd is private, and GitHub does not let public repos resolve reusable
# workflows in private repos ("workflow was not found"). Keep the logic in sync with
# cicd/build-push.yml + bump-fleet-tag.yml by hand if either grows features we need.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - ".dockerignore"
      - "deploy/**"
      - "production-release.json"
      - ".github/workflows/build.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - ".dockerignore"
      - "deploy/**"
      - "production-release.json"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  release:
    # Never execute code from an untrusted fork on the internal runner.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: napbat-selfhosted-linux
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0
      - name: Verify immutable Fleet release
        shell: bash
        run: |
          set -euo pipefail
          yq_bin="$RUNNER_TEMP/yq"
          curl --fail --silent --show-error --location \
            --output "$yq_bin" \
            https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64
          echo "fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4  $yq_bin" \
            | sha256sum --check --strict
          chmod 0555 "$yq_bin"

          values="$RUNNER_TEMP/s3cache-production-values.yaml"
          "$yq_bin" '.helm.values' deploy/helm/s3cache/fleet.yaml > "$values"
          rendered="$RUNNER_TEMP/s3cache-production.yaml"
          helm template s3cache deploy/helm/s3cache --namespace data \
            --values "$values" > "$rendered"
          actual="$(awk '/^[[:space:]]*image:/ {gsub(/^[[:space:]]*image:[[:space:]]*[\042\047]?|[\042\047]?[[:space:]]*$/, ""); if (length) print}' "$rendered" | sort --unique)"
          jq --exit-status '
            type == "object" and
            (keys == ["apiVersion", "bundles", "kind", "status"]) and
            .apiVersion == "platform.napbat.ca/v1alpha1" and
            .kind == "FleetRelease" and
            .status == "ready" and
            (.bundles | length == 1) and
            (.bundles[0] | keys == ["images", "path"]) and
            .bundles[0].path == "deploy/helm/s3cache" and
            (.bundles[0].images | length == 1) and
            (.bundles[0].images[0] | keys == ["name", "reference"]) and
            .bundles[0].images[0].name == "s3cache"
          ' production-release.json >/dev/null
          expected="$(jq -r '.bundles[0].images[0].reference' production-release.json)"
          test "$actual" = "$expected"
          [[ "$actual" =~ ^ghcr\.io/napbat/s3cache:[0-9a-f]{40}@sha256:[0-9a-f]{64}$ ]]

  # Locked Rust lint/test/docs gate plus Helm lint/render. The MinIO-backed tests need
  # the Docker daemon supplied by the internal ARC runner.
  test:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: napbat-selfhosted-linux
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          components: clippy, rustfmt
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v3.19.0
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8.2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features
      - run: cargo test --locked --workspace --all-features
      - run: cargo doc --locked --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: helm lint deploy/helm/s3cache --set upstream.endpoint=https://example.com
      - run: helm template deploy/helm/s3cache --set upstream.endpoint=https://example.com
      - name: Keep Fleet replicated after the feed rollout
        run: |
          grep -q '^    replicaCount: 2$' deploy/helm/s3cache/fleet.yaml
      - name: Render replicated availability path
        run: |
          set -euo pipefail
          rendered="$(helm template deploy/helm/s3cache \
            --set upstream.endpoint=https://example.com \
            --set replicaCount=2)"
          grep -q '^kind: PodDisruptionBudget$' <<<"$rendered"
          grep -q '^  maxUnavailable: 1$' <<<"$rendered"
          grep -q '^  minReadySeconds: 5$' <<<"$rendered"

  # Image build + push (inlined from cicd/build-push.yml): SHA tag (deploys pin to
  # it) + mutable latest, registry-backed BuildKit cache so the heavy cargo layers
  # reuse across builds. provenance/sbom off: the attestation stages turn the export
  # into a manifest list and break registry cache reuse (build-push-action#820).
  server:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: napbat-selfhosted-linux
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.0.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.0.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.0.0
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/napbat/s3cache:${{ steps.meta.outputs.tag }}
            ghcr.io/napbat/s3cache:latest
          provenance: false
          sbom: false
          cache-from: type=registry,ref=ghcr.io/napbat/s3cache:buildcache
          cache-to: type=registry,ref=ghcr.io/napbat/s3cache:buildcache,mode=max

  # Write the built SHA into the Fleet chart tag (inlined from cicd/bump-fleet-tag.yml).
  # Gates on tests AND the image push. Loop-safe: the commit is authored by the default
  # GITHUB_TOKEN (whose pushes don't trigger workflows) and carries [skip ci].
  bump:
    needs: [test, server]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: napbat-selfhosted-linux
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Write tag + commit
        env:
          SHA: ${{ needs.server.outputs.tag }}
          DIGEST: ${{ needs.server.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          yq_bin="$RUNNER_TEMP/yq"
          curl --fail --silent --show-error --location \
            --output "$yq_bin" \
            https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64
          echo "fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4  $yq_bin" \
            | sha256sum --check --strict
          chmod 0555 "$yq_bin"
          "$yq_bin" -i '.helm.values.image.tag = strenv(SHA) | .helm.values.image.digest = strenv(DIGEST)' \
            deploy/helm/s3cache/fleet.yaml
          reference="ghcr.io/napbat/s3cache:${SHA}@${DIGEST}"
          REFERENCE="$reference" "$yq_bin" -o=json -I=2 -i \
            '.status = "ready" | .bundles[0].images[0].reference = strenv(REFERENCE)' \
            production-release.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deploy/helm/s3cache/fleet.yaml production-release.json
          if git diff --cached --quiet; then
            echo "release already points at ${SHA}; nothing to commit"
            exit 0
          fi
          git commit -m "fleet: deploy ${SHA} [skip ci]"
          for attempt in 1 2 3; do
            if git push origin "HEAD:${{ github.ref_name }}"; then exit 0; fi
            echo "push rejected; rebasing (attempt ${attempt})"
            git pull --rebase --autostash origin "${{ github.ref_name }}"
          done
          echo "failed to push release bump after retries" >&2
          exit 1
