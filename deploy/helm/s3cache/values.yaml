# Single replica is intentional and load-bearing: the in-memory LIST index is
# authoritative and correct ONLY as the sole path to the bucket, so this must stay 1
# (see the chart's Recreate strategy + the startupProbe note in the Deployment). HA is
# by fast restart — a fresh pod re-syncs from R2 before it opens its port — not by
# horizontal replication (which would let replicas' indexes diverge).
replicaCount: 1

# Headroom for the initial full-bucket R2 sync before the port opens (periodSeconds 5 ×
# failureThreshold). Raise it if a bucket grows large enough that the first sync needs
# more than ~10 min; the pod stays un-Ready (no traffic) until it finishes, then normal
# liveness/readiness apply.
startupProbe:
  failureThreshold: 120

image:
  repository: ghcr.io/napbat/s3cache
  tag: latest
  pullPolicy: IfNotPresent

# Private image → reference the shared ghcr-pull Secret from the cicd secrets bundle.
imagePullSecret:
  existingSecret: ghcr-pull

# Upstream S3 (R2) the proxy forwards to.
upstream:
  endpoint: ""            # e.g. https://<acct>.r2.cloudflarestorage.com  (required)
  buckets: ""             # comma-separated buckets to index eagerly, e.g. "docres"

# AWS/R2 credentials (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_REGION) come from
# this externally-provided Secret (cicd/fleet/secrets/prod/s3cache.yaml).
auth:
  existingSecret: s3cache-s3

service:
  port: 8014

resources: {}
