# Replica count. With indexLog.enabled=false (default) the in-memory LIST index is
# node-local, so this MUST stay 1 (replicas would diverge) — HA is by fast restart, and
# the chart uses the Recreate strategy. With indexLog.enabled=true the replicas share
# one coherent index over the commit log, so you can safely raise this (and the chart
# switches to RollingUpdate).
replicaCount: 1

image:
  repository: ghcr.io/napbat/s3cache
  tag: latest
  pullPolicy: IfNotPresent

# Private image → reference the shared ghcr-pull Secret from the cicd secrets bundle.
imagePullSecret:
  existingSecret: ghcr-pull

# Upstream S3 (R2) the proxy forwards to.
upstream:
  endpoint: ""            # e.g. https://<acct>.r2.cloudflarestorage.com  (required)
  buckets: ""             # comma-separated buckets to index eagerly

# Object-body cache: hot (in-memory) is always on. An optional node-local disk (warm)
# tier holds more and survives restarts (a fresh pod comes up warm). Mount a volume at
# diskCache.path; a persistentVolumeClaim survives pod reschedules, emptyDir only restarts.
diskCache:
  enabled: false
  path: /var/cache/s3cache
  bytes: 10737418240        # 10 GiB
  volume:                   # any pod-volume spec backing diskCache.path
    emptyDir: {}

# Shared Valkey/Redis, used only by the index commit log (cross-node coherence). Required
# when indexLog.enabled is true. (Being retired in favor of an embedded log — see README.)
valkey:
  url: ""                 # e.g. redis://valkey.default.svc.cluster.local:6379
  pool: 4                 # Valkey connections per replica

# Cross-node index coherence via a Valkey Streams commit log. Enable this to run more
# than one replica without their LIST indexes drifting (requires valkey.url). Works with
# any cache.mode. See the repo README, "Cross-node coherence".
# With the index log on, cross-node reads are always strongly consistent (reads barrier
# on the log so a peer's just-completed write is never read stale) — not configurable.
indexLog:
  enabled: false
  maxlen: 1000000         # approximate max entries kept in the log stream
  stream: ""              # override the stream key (default: s3cache:index:log)

# AWS/R2 credentials (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_REGION) come from
# this externally-provided Secret (cicd/fleet/secrets/prod/s3cache.yaml).
auth:
  existingSecret: s3cache-s3

service:
  port: 8014

resources: {}
