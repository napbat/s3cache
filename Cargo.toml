[workspace]
members = ["."]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
description = "Transparent S3 caching proxy — serves LIST and HEAD from an in-memory key index and GET from a tiered hot (heap) / warm (disk) / cold (origin) object cache, write-through (fill-on-write) to an upstream S3. Cuts S3 request costs for chatty clients."
license = "MIT"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-credential-types = "1"
aws-sdk-s3 = "1"
base64 = "0.23"
# Final release, kept only to build legacy-format test fixtures (see `codec::legacy`).
bincode = "1.3.3"
blake3 = "1.8.5"
bytes = { version = "1", features = ["serde"] }
futures = "0.3"
getrandom = "0.4"
groupnet = { git = "https://github.com/napbat/groupnet", rev = "5908aad98d2a7a0e077bab1a2fdf1d957997ea49", features = ["consistency-leases", "consistency-volatile-recovery", "consistency-volatile-bootstrap-bulk", "tcp", "udp"] }
http = "1"
http-body-util = "0.1"
# Already under hyper-util/s3s; direct so the metrics endpoint can build its own responses.
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server-auto", "server-graceful", "http1", "http2", "tokio"] }
# Persistent ordered maps: the LIST index's rows share structure with the donor's
# snapshot at C, so taking it copies no row.
imbl = "7"
# The serde codec for s3cache's own formats; `use-std` without the default `heapless`.
postcard = { version = "1.1.3", default-features = false, features = ["use-std"] }
rlimit = "0.11"
s3s = "0.17"
s3s-aws = "0.17"
serde = { version = "1.0.228", features = ["derive"] }
# A real S3 origin (MinIO) for the end-to-end tests — conditional writes, ETags and
# error codes are the upstream's semantics, so the tests put the real thing behind us.
testcontainers = { version = "0.28", features = ["http_wait"] }
tierstore = { git = "https://github.com/napbat/tierstore", branch = "main" }
tierstore-mmap = { git = "https://github.com/napbat/tierstore", branch = "main" }
tierstore-moka = { git = "https://github.com/napbat/tierstore", branch = "main" }
tokio = { version = "1", features = ["full"] }
time = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[workspace.lints.rust]
unused_imports = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }

[package]
name = "s3cache"
version.workspace = true
edition.workspace = true
description.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
aws-config.workspace = true
aws-credential-types.workspace = true
aws-sdk-s3.workspace = true
base64.workspace = true
blake3.workspace = true
bytes.workspace = true
futures.workspace = true
getrandom.workspace = true
groupnet.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
imbl.workspace = true
postcard.workspace = true
rlimit.workspace = true
s3s.workspace = true
s3s-aws.workspace = true
serde.workspace = true
tierstore.workspace = true
tierstore-mmap.workspace = true
tierstore-moka.workspace = true
tokio.workspace = true
time.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[profile.release]
opt-level = 2

[dev-dependencies]
# Real bincode 1 bytes: the fixtures that prove `codec::legacy` still reads what
# earlier releases stored. Never a runtime dependency.
bincode.workspace = true
testcontainers.workspace = true
# The tests' counting forwarder needs hyper's client half; the binary only ever serves.
hyper = { workspace = true, features = ["client"] }

[[bench]]
name = "warm_decode"
harness = false
