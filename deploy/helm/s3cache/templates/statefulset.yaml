apiVersion: apps/v1
# A StatefulSet in every mode: stable pod names are the gossip node identities when
# coherence is on, and its delete-then-recreate rolling update means two copies of one
# ordinal never overlap (which is all single-replica mode needs from the old Recreate).
kind: StatefulSet
metadata:
  name: s3cache
  labels:
    app.kubernetes.io/name: s3cache
spec:
  replicas: {{ .Values.replicaCount }}
  serviceName: s3cache-gossip
  podManagementPolicy: Parallel
  # A new ordinal must remain ready before a rolling update advances to the next
  # one. This gives the Service and gossip feed a stable overlap window.
  minReadySeconds: {{ .Values.availability.minReadySeconds | int64 }}
  selector:
    matchLabels:
      app.kubernetes.io/name: s3cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: s3cache
      {{- if .Values.metrics.enabled }}
      # Pod-level scrape annotations, for the Prometheus setups that discover pods
      # rather than ServiceMonitors. Same conditional as the port and the listener:
      # metrics.enabled turns on the whole path, not just the process.
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: {{ .Values.metrics.port | int64 | quote }}
        prometheus.io/path: /metrics
      {{- end }}
    spec:
      {{- with .Values.imagePullSecret.existingSecret }}
      imagePullSecrets:
        - name: {{ . }}
      {{- end }}
      containers:
        - name: s3cache
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: s3
              containerPort: 8014
            - name: gossip
              containerPort: {{ .Values.gossip.port }}
              protocol: UDP
            {{- if .Values.metrics.enabled }}
            - name: metrics
              containerPort: {{ .Values.metrics.port | int64 }}
            {{- end }}
          env:
            - name: S3CACHE_LISTEN
              value: "0.0.0.0:8014"
            - name: S3CACHE_UPSTREAM_ENDPOINT
              value: {{ required "upstream.endpoint is required" .Values.upstream.endpoint | quote }}
            - name: S3CACHE_BUCKETS
              value: {{ .Values.upstream.buckets | quote }}
            # Hot-tier sizing: the in-memory budget objects roll over from (into the
            # warm disk tier when enabled) and the per-object cacheability cap.
            # int64 before quote: Helm's YAML round-trip makes big numbers float64,
            # which would render "2.68e+08" and fail the binary's integer parse.
            - name: S3CACHE_CACHE_BYTES
              value: {{ .Values.memoryCache.bytes | int64 | quote }}
            - name: S3CACHE_MAX_OBJECT_BYTES
              value: {{ .Values.memoryCache.maxObjectBytes | int64 | quote }}
            {{- if .Values.diskCache.enabled }}
            - name: S3CACHE_DISK_CACHE
              value: {{ .Values.diskCache.path | quote }}
            - name: S3CACHE_DISK_CACHE_BYTES
              value: {{ .Values.diskCache.bytes | int64 | quote }}
            {{- end }}
            {{- if .Values.metrics.enabled }}
            # Prometheus text endpoint (GET /metrics), on its own port so the S3 API
            # port stays exactly the S3 API.
            - name: S3CACHE_METRICS_LISTEN
              value: "0.0.0.0:{{ .Values.metrics.port | int64 }}"
            {{- end }}
            # Pod name = gossip node id (HOSTNAME is set by the kubelet). Pod-0 is the
            # only static seed; the rest resolves via gossiped advertisements. The
            # advertise address must be the routable pod IP (peers parse it as an
            # address), hence the downward API rather than a DNS name. Always on: a
            # single replica is a cluster of one, and scaling is just replicaCount.
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: S3CACHE_GOSSIP_BIND
              value: "0.0.0.0:{{ .Values.gossip.port }}"
            - name: S3CACHE_GOSSIP_ADVERTISE
              value: "$(POD_IP):{{ .Values.gossip.port }}"
            # Two seed ordinals when there can be a peer: each pod skips itself,
            # leaving pod-0 seeding pod-1 and everyone else seeding pod-0. A
            # single-replica cluster names only pod-0, so its skipped self entry
            # does not generate a permanent unresolved-peer warning.
            - name: S3CACHE_GOSSIP_SEEDS
              value: {{ if gt (int .Values.replicaCount) 1 }}"s3cache-0=s3cache-0.s3cache-gossip:{{ .Values.gossip.port }},s3cache-1=s3cache-1.s3cache-gossip:{{ .Values.gossip.port }}"{{ else }}"s3cache-0=s3cache-0.s3cache-gossip:{{ .Values.gossip.port }}"{{ end }}
            - name: S3CACHE_CONSISTENCY
              value: {{ .Values.gossip.consistency | quote }}
            {{- with .Values.gossip.leaseMs }}
            # Coherence-lease duration D (strong mode): the writer's worst-case stall on
            # a silent peer, and each reader's window between confirmations. Unset here
            # means the binary's own default (2000ms) — the value the whole tier is tuned
            # around, so override it deliberately or not at all.
            - name: S3CACHE_LEASE_MS
              value: {{ . | int64 | quote }}
            {{- end }}
            - name: RUST_LOG
              value: "info"
          # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_REGION for the upstream.
          envFrom:
            - secretRef:
                name: {{ .Values.auth.existingSecret }}
          # No startupProbe needed: the proxy binds + serves immediately and warms its LIST
          # index in the background (LISTs pass through until warm), so readiness/liveness
          # can engage right away regardless of bucket size.
          readinessProbe:
            tcpSocket:
              port: s3
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: s3
            initialDelaySeconds: 10
            periodSeconds: 30
          resources: {{- toYaml .Values.resources | nindent 12 }}
          {{- if .Values.diskCache.enabled }}
          volumeMounts:
            - name: disk-cache
              mountPath: {{ .Values.diskCache.path }}
          {{- end }}
      {{- if and .Values.diskCache.enabled (not .Values.diskCache.volumeClaimTemplate) }}
      volumes:
        - name: disk-cache
          {{- toYaml .Values.diskCache.volume | nindent 10 }}
      {{- end }}
  {{- if and .Values.diskCache.enabled .Values.diskCache.volumeClaimTemplate }}
  # Per-ordinal PVCs: the warm tier survives deploys (delete-then-recreate kills
  # emptyDirs) and reschedules, and scaling replicas mints one claim per pod.
  volumeClaimTemplates:
    - metadata:
        name: disk-cache
      spec: {{- toYaml .Values.diskCache.volumeClaimTemplate | nindent 8 }}
  {{- end }}
