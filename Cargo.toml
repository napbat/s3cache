[package]
name = "s3cache"
version = "0.1.0"
edition = "2024"
description = "Transparent S3 caching proxy — serves LIST and HEAD from an in-memory key index and GET from a tiered hot (heap) / warm (disk) / cold (origin) object cache, write-through (fill-on-write) to an upstream S3. Cuts S3 request costs for chatty clients."
license = "MIT"

[dependencies]
s3s = "0.14.0"
s3s-aws = "0.14.0"
async-trait = "0.1"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
aws-credential-types = "1"
tokio = { version = "1", features = ["full"] }
hyper-util = { version = "0.1", features = ["server-auto", "server-graceful", "http1", "http2", "tokio"] }
# Already under hyper-util/s3s; direct so the metrics endpoint can build its own responses.
hyper = { version = "1", features = ["server", "http1"] }
http-body-util = "0.1"
tierstore = { git = "https://github.com/napbat/tierstore", branch = "main" }
tierstore-mmap = { git = "https://github.com/napbat/tierstore", branch = "main" }
tierstore-moka = { git = "https://github.com/napbat/tierstore", branch = "main" }
groupnet = { git = "https://github.com/napbat/groupnet", branch = "main", features = ["consistency-acks", "udp"] }
bytes = { version = "1", features = ["serde"] }
http = "1"
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rlimit = "0.10"
anyhow = "1"
serde = { version = "1.0.228", features = ["derive"] }
bincode = "1"
blake3 = "1.8.5"

[lints.clippy]
pedantic = { level = "deny", priority = -1 }

[profile.release]
opt-level = 2

[dev-dependencies]
# A real S3 origin (MinIO) for the end-to-end tests — conditional writes, ETags and
# error codes are the upstream's semantics, so the tests put the real thing behind us.
testcontainers = { version = "0.27.3", features = ["http_wait"] }
# The tests' counting forwarder needs hyper's client half; the binary only ever serves.
hyper = { version = "1", features = ["client"] }
