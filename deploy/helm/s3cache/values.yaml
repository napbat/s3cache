# Replica count — the ONE scaling knob. Every pod is always a gossip cluster member
# (a single replica is just a cluster of one, which costs nothing); raising this adds
# coherent replicas with no other configuration.
replicaCount: 1

# Rollout and voluntary-disruption safety. StatefulSet updates already replace
# ordinals one at a time; minReadySeconds keeps the survivor/new peer overlap long
# enough for endpoint programming and gossip convergence. The PDB is rendered only
# for replicated releases, where maxUnavailable=1 cannot deadlock a singleton.
availability:
  minReadySeconds: 5
  podDisruptionBudget: true

image:
  repository: ghcr.io/napbat/s3cache
  tag: latest
  pullPolicy: IfNotPresent

# Private image → reference the shared ghcr-pull Secret from the cicd secrets bundle.
imagePullSecret:
  existingSecret: ghcr-pull

# Upstream S3 (R2) the proxy forwards to.
upstream:
  endpoint: ""            # e.g. https://<acct>.r2.cloudflarestorage.com  (required)
  buckets: ""             # comma-separated buckets to index eagerly

# Hot (in-memory) tier — always on. `bytes` is the heap budget and the rollover point:
# objects evicted from here are still served from the disk (warm) tier when enabled.
# `maxObjectBytes` caps what gets cached at all; bigger objects stream straight through.
memoryCache:
  bytes: 268435456          # 256 MiB (S3CACHE_CACHE_BYTES)
  maxObjectBytes: 8388608   # 8 MiB (S3CACHE_MAX_OBJECT_BYTES)

# Object-body cache: hot (in-memory) is always on. An optional node-local disk (warm)
# tier holds more and survives restarts (a fresh pod comes up warm). Mount a volume at
# diskCache.path; a persistentVolumeClaim survives pod reschedules, emptyDir only restarts.
diskCache:
  enabled: false
  path: /var/cache/s3cache
  bytes: 10737418240        # 10 GiB
  # Prefer volumeClaimTemplate for anything that should survive a deploy: the
  # StatefulSet's delete-then-recreate update deletes the pod (and any emptyDir)
  # on every rollout, while a claim template gives each ordinal its own PVC that
  # persists across deploys and reschedules. When set, it wins over `volume`.
  volumeClaimTemplate: {}   # a PVC spec, e.g. {accessModes: [ReadWriteOnce], resources: {requests: {storage: 25Gi}}}
  volume:                   # any pod-volume spec backing diskCache.path
    emptyDir: {}

# Cross-node coherence via the gossip write feed (groupnet) — always on, no extra
# services, no toggle: pods gossip over a headless UDP service, pod-0 is the only
# static seed (everyone else resolves through gossiped advertisements), and pod names
# are the node identities. A single replica is a cluster of one.
gossip:
  port: 7946
  # strong (default): coherence leases. A pod may answer from its own index or body cache
  # only while it holds an unexpired serve-lease its peers granted, so a write ends when
  # every lease-holder has either applied the invalidation (one ack round) or had its
  # lease lapse (bounded by leaseMs, on the stale pod's own clock) — indistinguishable
  # from one S3 node, right for fleet-sized clusters. bounded: reads fresh within ~one
  # gossip hop, writes return on the origin ack, no per-write cluster round — for large
  # clusters. strong-acks: the pre-lease mechanism, DEPRECATED and removed next release;
  # set it only to pin today's behaviour while the fleet rolls. Set uniformly.
  consistency: strong
  # Coherence-lease duration D in milliseconds (S3CACHE_LEASE_MS), strong mode only.
  # The knob trading write-stall-under-failure against renewal traffic: a writer whose
  # peer goes silent stalls at most one D, and each pod republishes one small entry every
  # D/3 to keep its lease. It also sets the fleet's membership dead_timeout, so raising it
  # lengthens the freeze a single unresponsive pod costs every reader. Empty = 2000.
  leaseMs: ""

# Prometheus text endpoint (GET /metrics) on its own port, carrying the same counters as
# the 60s stats line — graphable and alertable instead of diffed out of pod logs by hand.
# Off by default: nothing else changes when it is on, it is just another listener.
metrics:
  enabled: false
  port: 9090

# AWS/R2 credentials (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY / AWS_REGION) come from
# this externally-provided Secret (cicd/fleet/secrets/prod/s3cache.yaml).
auth:
  existingSecret: s3cache-s3

service:
  port: 8014

resources: {}
