name: build

# Test-gate, build + push the s3cache image to GHCR, then bump the Fleet chart tag to
# the built SHA so Fleet rolls it. The bump lands only after BOTH the image push and
# the test suite succeed, so Fleet never chases a missing image or ships a red build.
#
# Jobs are inlined rather than calling napbat/cicd's reusable workflows: this repo is
# public and cicd is private, and GitHub does not let public repos resolve reusable
# workflows in private repos ("workflow was not found"). Keep the logic in sync with
# cicd/build-push.yml + bump-fleet-tag.yml by hand if either grows features we need.

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - ".dockerignore"
      - "deploy/**"
      - ".github/workflows/build.yml"
  # Pull requests run the test gate only; the image push and the Fleet bump stay on main.
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "Dockerfile"
      - ".dockerignore"
      - "deploy/**"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  # Locked Rust lint/test/docs gate plus Helm lint/render. Run the real MinIO tests
  # locally. CI runs every unit test and the integration modules that do not need an
  # origin. The unit tests run in their own step: a test-name filter would skip them.
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: azure/setup-helm@v5
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --locked --workspace --all-targets --all-features
      - run: cargo test --locked --workspace --all-features --lib --bins
      - run: "cargo test --locked --workspace --all-features --test it -- metrics_endpoint:: tier_cache:: startup_readiness::"
      - run: cargo doc --locked --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - run: helm lint deploy/helm/s3cache --set upstream.endpoint=https://example.com
      - run: helm template deploy/helm/s3cache --set upstream.endpoint=https://example.com
      - name: Keep Fleet replicated after the feed rollout
        run: |
          grep -q '^    replicaCount: 2$' deploy/helm/s3cache/fleet.yaml
      - name: Render replicated availability path
        run: |
          set -euo pipefail
          rendered="$(helm template deploy/helm/s3cache \
            --set upstream.endpoint=https://example.com \
            --set replicaCount=2)"
          grep -q '^kind: PodDisruptionBudget$' <<<"$rendered"
          grep -q '^  maxUnavailable: 1$' <<<"$rendered"
          grep -q '^  minReadySeconds: 5$' <<<"$rendered"

  # Image build + push (inlined from cicd/build-push.yml): SHA tag (deploys pin to
  # it) + mutable latest, registry-backed BuildKit cache so the heavy cargo layers
  # reuse across builds. provenance/sbom off: the attestation stages turn the export
  # into a manifest list and break registry cache reuse (build-push-action#820).
  server:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        run: |
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: |
            ghcr.io/napbat/s3cache:${{ steps.meta.outputs.tag }}
            ghcr.io/napbat/s3cache:latest
          provenance: false
          sbom: false
          cache-from: type=registry,ref=ghcr.io/napbat/s3cache:buildcache
          cache-to: type=registry,ref=ghcr.io/napbat/s3cache:buildcache,mode=max

  # Write the built SHA into the Fleet chart tag (inlined from cicd/bump-fleet-tag.yml).
  # Gates on tests AND the image push. Loop-safe: the commit is authored by the default
  # GITHUB_TOKEN (whose pushes don't trigger workflows) and carries [skip ci].
  # The tag never moves backwards: an older run that finishes after a newer one keeps
  # the newer tag.
  bump:
    if: github.event_name != 'pull_request'
    needs: [test, server]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - name: Write tag + commit
        env:
          BRANCH: ${{ github.ref_name }}
          FILE: deploy/helm/s3cache/fleet.yaml
          SHA: ${{ needs.server.outputs.tag }}
        run: |
          set -euo pipefail
          command -v yq >/dev/null || {
            sudo curl -fsSL -o /usr/local/bin/yq \
              https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
            sudo chmod +x /usr/local/bin/yq
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Each attempt decides on the branch tip, and the push only fast-forwards,
          # so a bump that raced in is never undone.
          for attempt in 1 2 3 4 5; do
            git fetch --quiet origin "$BRANCH"
            git reset --quiet --hard "origin/$BRANCH"
            current="$(yq '.helm.values.image.tag // ""' "$FILE")"
            if [[ "$current" =~ ^[0-9a-f]{40}$ ]] \
              && git cat-file -e "${current}^{commit}" 2>/dev/null \
              && git merge-base --is-ancestor "$SHA" "$current"; then
              echo "keeping ${current}; ${SHA} is not newer"
              exit 0
            fi
            yq -i '.helm.values.image.tag = strenv(SHA)' "$FILE"
            git commit --quiet -m "fleet: deploy ${SHA} [skip ci]" -- "$FILE"
            if git push origin "HEAD:${BRANCH}"; then
              exit 0
            fi
            echo "push rejected; deciding again on the new tip (attempt ${attempt})"
          done
          echo "failed to push tag bump after retries" >&2
          exit 1
